<!DOCTYPE html>
<html>
  <head>
    <title>USFM Debug Output</title>
    <style>
      /* Preview mode: Hide markers */
      usfm.preview marker {
        display: none !important;
        background: red;
      }
      usfm.preview attributes {
        display: none !important;
        background: blue;
      }

      /* Debug: Show what should be visible */
      usfm.preview number {
        display: inline;
        background: green;
      }
      usfm.preview content {
        display: inline;
        background: yellow;
      }

      /* Debug mode: show everything */
      usfm.debug marker {
        display: inline;
        background: pink;
        border: 1px solid red;
      }
      usfm.debug attributes {
        display: inline;
        background: lightblue;
        border: 1px solid blue;
      }
    </style>
  </head>
  <body>
    <h2>Preview Mode (should show clean text)</h2>
    <div id="preview-output"></div>

    <h2>Debug Mode (shows everything)</h2>
    <div id="debug-output"></div>

    <script type="module">
      import USFMSemanticRenderer from "./src/components/ScripturePanelRCL/USFMSemanticRenderer.jsx";
      import { parseUSFMToHTML } from "./src/components/ScripturePanelRCL/USFMSemanticParser.js";

      const simpleUSFM = `\\v 1 \\w Paul|x-occurrence="1"\\w* text`;

      console.log("Input USFM:", simpleUSFM);

      const previewHTML = parseUSFMToHTML(simpleUSFM, "preview");
      const debugHTML = parseUSFMToHTML(simpleUSFM, "debug");

      console.log("Preview HTML:", previewHTML);
      console.log("Debug HTML:", debugHTML);

      document.getElementById("preview-output").innerHTML = previewHTML;
      document.getElementById("debug-output").innerHTML = debugHTML;

      // Test textContent preservation
      const tempDiv = document.createElement("div");
      tempDiv.innerHTML = previewHTML;
      console.log("TextContent equals input?", tempDiv.textContent === simpleUSFM);
      console.log("TextContent:", tempDiv.textContent);
    </script>
  </body>
</html>
